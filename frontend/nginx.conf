log_format microtrace '$request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/access.log microtrace;

    # Docker DNS is re-resolved after internal containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $trace_backend http://trace-backend:8000;
    set $order_backend http://order-service:8000;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_set_header Host $host;

    location = /api/v1/traces {
        if ($request_method != GET) { return 405; }
        proxy_pass $trace_backend$request_uri;
    }
    location ~ "^/api/v1/traces/[0-9a-f]{32}$" {
        if ($request_method != GET) { return 405; }
        proxy_pass $trace_backend$request_uri;
    }
    location = /api/v1/services {
        if ($request_method != GET) { return 405; }
        proxy_pass $trace_backend$request_uri;
    }
    location = /health {
        if ($request_method != GET) { return 405; }
        proxy_pass $trace_backend$request_uri;
    }
    location = /orders {
        if ($request_method != POST) { return 405; }
        proxy_pass $order_backend$request_uri;
    }

    # No catch-all API proxy: ingestion and framework docs stay private.
    location /api/ { return 404; }
    location = /api { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
