name: MicroTrace QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: microtrace_test
          POSTGRES_USER: microtrace_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U microtrace_test -d microtrace_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://microtrace_test:ci-only-test-password@localhost:5432/microtrace_test
      MICROTRACE_TEST_DATABASE_URL: postgresql+psycopg://microtrace_test:ci-only-test-password@localhost:5432/microtrace_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Audit real commits, not GitHub's temporary PR merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: python scripts/check_repository.py
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -m 'not integration'
        working-directory: backend
      - run: pytest -m integration
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      # These are public disposable CI credentials, never production credentials.
      - name: Configure disposable local stack
        run: |
          cat > .env <<'ENV'
          POSTGRES_DB=microtrace
          POSTGRES_USER=microtrace
          POSTGRES_PASSWORD=ci-only-test-password
          DATABASE_URL=postgresql+psycopg://microtrace:ci-only-test-password@postgres:5432/microtrace
          ENV
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T trace-backend alembic upgrade head
      - run: docker compose exec -T trace-backend python - < scripts/check_foundation.py
      - run: docker compose exec -T trace-backend python - < scripts/check_gate_c.py
      - run: python scripts/check_scenarios.py
      - run: python scripts/check_system.py
      - name: Switch to the six-container production stack
        run: |
          docker compose down
          docker compose -f compose.production.yml up --build -d --wait --wait-timeout 180
          docker compose -f compose.production.yml exec -T trace-backend alembic upgrade head
      - name: Verify production edge, private ports and persistence
        run: python scripts/check_production.py --check-restart --probe-private-ports
      - name: Shut down disposable stack
        if: always()
        run: docker compose -f compose.production.yml down
