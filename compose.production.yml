name: microtrace

x-backend: &backend
  build: ./backend
  init: true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    interval: 5s
    timeout: 6s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  trace-backend:
    <<: *backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    <<: *backend
    command: ["uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &telemetry
      COLLECTOR_URL: ${COLLECTOR_URL:-http://trace-backend:8000/api/v1/spans}
      EXPORT_QUEUE_SIZE: ${EXPORT_QUEUE_SIZE:-256}
      EXPORT_TIMEOUT_SECONDS: ${EXPORT_TIMEOUT_SECONDS:-1}

  notification-service:
    <<: *backend
    command: ["uvicorn", "services.notification.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *telemetry

  order-service:
    <<: *backend
    command: ["uvicorn", "services.order.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *telemetry
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8000}
    depends_on:
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    init: true
    restart: unless-stopped
    ports:
      - "${MICROTRACE_BIND_ADDRESS:-127.0.0.1}:${MICROTRACE_HTTP_PORT:-8080}:80"
    depends_on:
      trace-backend:
        condition: service_started
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
